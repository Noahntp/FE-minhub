name: Frontend CD

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        env:
          VITE_API_BASE_URL: https://mindhub.io.vn/BE/public/index.php/api
          VITE_API_MODE: api
          VITE_MEDIA_BASE_URL: https://mindhub.io.vn/mindhub-media
        run: npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            APP_DIR="/var/www/mindhub-frontend"
            RELEASE_ID=$(date +%Y%m%d%H%M%S)
            RELEASE_DIR="${APP_DIR}/releases/${RELEASE_ID}"
            CURRENT_LINK="${APP_DIR}/current"
            
            echo "Starting Frontend deployment for release ${RELEASE_ID}..."
            
            # Tạo thư mục release
            mkdir -p ${RELEASE_DIR}
            
      - name: Copy Build to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/mindhub-frontend/releases/latest_build"
          strip_components: 1

      - name: Finalize Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            APP_DIR="/var/www/mindhub-frontend"
            # Tìm release ID mới nhất vừa được SCP lên
            RELEASE_ID=$(date +%Y%m%d%H%M%S)
            RELEASE_DIR="${APP_DIR}/releases/${RELEASE_ID}"
            CURRENT_LINK="${APP_DIR}/current"
            PREVIOUS_LINK="${APP_DIR}/previous"

            # Đổi tên thư mục latest_build thành RELEASE_ID
            mv ${APP_DIR}/releases/latest_build ${RELEASE_DIR}

            echo "Switching active release (Symlink)..."
            if [ -L "$CURRENT_LINK" ]; then
              # Lưu lại version cũ để rollback
              ln -snf $(readlink -f $CURRENT_LINK) $PREVIOUS_LINK
            fi

            # Trỏ symlink current tới thư mục dist mới
            ln -snf ${RELEASE_DIR} $CURRENT_LINK

            # Dọn dẹp các release cũ (Giữ lại 3 bản gần nhất)
            ls -1dt ${APP_DIR}/releases/* | grep -v 'latest_build' | tail -n +4 | xargs -d '\n' rm -rf || true
            
            echo "Deployment successful!"
