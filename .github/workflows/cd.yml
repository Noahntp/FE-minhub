name: Frontend CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        env:
          VITE_API_BASE_URL: https://mindhub.io.vn/BE/public/index.php/api
          VITE_API_MODE: api
          VITE_MEDIA_BASE_URL: https://mindhub.io.vn/mindhub-media
        run: npm run build

      - name: Deploy to Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER || secrets.SSH_HOST || '62.171.157.22' }}
          username: ${{ secrets.FTP_USERNAME || secrets.SSH_USER || 'xam' }}
          password: ${{ secrets.FTP_PASSWORD || secrets.SSH_PASSWORD || 'EJmW5bmmihX6XBNK' }}
          server-dir: /
          local-dir: ./dist/
          dangerous-clean-slate: false

      - name: Sync SPA Route Index Files
        run: |
          echo "Deployment to production server finished successfully!"
