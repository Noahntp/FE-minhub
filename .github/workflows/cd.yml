name: CD - Deploy Frontend to Server
run-name: 🚀 CD Frontend (${{ github.ref_name }}) - ${{ github.event.head_commit.message || 'Deploy' }}

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        env:
          VITE_API_BASE_URL: https://mindhub.io.vn/BE/public/api
          VITE_API_MODE: api
          VITE_MEDIA_BASE_URL: https://mindhub.io.vn/mindhub-media
        run: npm run build

      - name: Deploy to Server via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
        run: |
          echo "📦 Đóng gói mã nguồn build dist..."
          tar -czf /tmp/fe_dist.tar.gz -C dist .

          echo "🔑 Cấu hình SSH Key..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "🚀 Tải gói mã nguồn lên máy chủ..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -P 22 /tmp/fe_dist.tar.gz root@62.171.157.22:/tmp/fe_dist.tar.gz

          echo "📂 Giải nén và cập nhật /www/wwwroot/default..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p 22 root@62.171.157.22 "tar -xzf /tmp/fe_dist.tar.gz -C /www/wwwroot/default && rm -f /tmp/fe_dist.tar.gz && chown -R www:www /www/wwwroot/default/assets /www/wwwroot/default/index.html"

          echo "✅ Frontend triển khai thành công 100%!"
